# Default experiment for run.ipynb; parameters are ordered by pipeline stage.
# evaluate.ipynb restores the saved architecture; an explicit YAML override changes
# only inference, score, calibration, weighting and alpha_grid.
split_seed: 3407               # Data splits, scorer randomness and density-ratio fitting
training_seed: 3407            # Initialization, shuffle, Dropout and augmentation
prepare_npy_cache: false     # true: convert data/*_raw.mat recursively; false: use existing NPY pairs

data:
  datasets: [crossroom]      # Paths relative to python/dataset/; absolute cache paths also work
  filename_template: "{user}_{activity}_{position}[_r{recording}]_time.npy" # [...] is optional
  task: activity            # Filename metadata field used as the prediction label
  domain_key: user           # Shared domain for splitting, both encoders, CL, sampling and weighting

split:
  mode: domain_holdout       # holdout: source split by segment; random: split whole recordings
  test_domains: [kailong]       # Values of data.domain_key; all their segments go to test in holdout mode
  validation_domains: []  # Holdout: isolate these users; [] samples validation within training domains
  validation_fraction: 0.1 # Fraction within each source domain/class; ignored when validation_domains is set
  calibration_fraction: 0.2 # Per source domain/class; excludes isolated validation and test domains
  test_fraction: 0.2        # Random mode only; all split fractions then refer to recording counts

model:
  kind: cnn_transformer           # dual_cnn / cnn_transformer / dual_link_graph
  embedding_dim: 64         # Output dimension of each encoder, including background when enabled
  stft_frequency_bins: 64   # 32 for setting_dataset/self_time; 64 for crossroom; must match cached STFT layout

encoder_task:
  task:
    enabled: true
    weight: 1              # Updates task encoder/head; validation CE stays unweighted
  contrastive:
    enabled: true
    weight: 1               # Multiplier on task CL, added to task CE; uses normalized embeddings
    temperature: 5.0e-2         # Positive: same task label, different domain
    # Anchors without cross-domain positives in the batch are skipped.
  adversarial:
    enabled: true
    conditional: false        # If true, append true task-label one-hot to the domain head; never fed to encoder
    max_weight: 1            # Maximum reversed gradient multiplier on the encoder
    warmup_epochs: 10          # Linear ramp from zero; 0 uses max_weight immediately
    hidden_dim: 64          # Task-domain adversary hidden width; background config has its own
  difference:
    enabled: true
    weight: 1.0e-2           # Decorrelate from detached background; updates only task encoder

# Optional background branch; all child switches require enabled: true.
encoder_background:
  enabled: false
  domain:
    enabled: true
    weight: 1            # Background domain CE; updates only background encoder/head
  contrastive:
    enabled: true
    weight: 1            # Multiplier on background supervised contrastive loss
    temperature: 5.0e-2       # Positive: same domain, different task label; lower = sharper similarities
  adversarial:
    enabled: true
    conditional: false        # If true, append true domain one-hot to the activity head; never fed to encoder
    max_weight: 1            # Maximum reversed gradient multiplier on the encoder
    warmup_epochs: 10          # Linear ramp from zero; 0 uses max_weight immediately
    hidden_dim: 64          # Background activity adversary hidden width; independent of task
  difference:
    enabled: true
    weight: 1.0e-2           # Decorrelate from detached task; updates only background encoder
    # Both branches use centered, column-normalized cross-correlation; not independence.

decoder:
  enabled: false             # Effective only with encoder_background.enabled; shares main optimizer/scheduler
  weight: 0.1            # Mean time/STFT relative MSE; updates both encoders and decoder
  # Targets augmented time and signed-log STFT inputs.

augmentation:
  enabled: true            # Training only; clean validation, calibration and test use no augmentation
  time_noise:
    enabled: true
    kind: gaussian          # none / gaussian / uniform
    relative_std: 2.0e-2      # Noise std relative to each sample/group RMS
    probability: 0.5       # Per-sample chance of adding noise
  time_mask:
    enabled: true
    max_fraction: 1.0e-1      # Random width: 0..floor(T * fraction), shared across rows/groups
    probability: 0.5       # Per-sample chance of selecting a mask; width can still be zero
  stft_mask:
    enabled: true
    frequency_bins: 64      # 32 for setting_dataset/self_time; 64 for crossroom; must equal model.stft_frequency_bins
    time_max_fraction: 5.0e-2       # Maximum fraction of time frames, not flattened width
    frequency_max_fraction: 5.0e-2  # Maximum fraction of frequency bins
    probability: 0.5             # Applied independently per sample and per axis

training:
  epochs: 30
  batch_size: 16           # Used when sampling.enabled=false; balanced sampler overrides this
  optimizer: sgd            # One optimizer for all modules: adamw / adam / sgd / rmsprop
  learning_rate: 1.0e-2
  weight_decay: 1.0e-3     # Shared optimizer regularization, including adversarial heads
  # Select ONE kwargs mapping matching the optimizer ({} uses PyTorch defaults).
  # sgd:     {momentum: 0.9, dampening: 0.0, nesterov: true}
  # adamw:   {betas: [0.9, 9.99e-1], eps: 1.0e-8, amsgrad: false}
  # adam:    {betas: [0.9, 9.99e-1], eps: 1.0e-8, amsgrad: false}
  # rmsprop: {alpha: 9.9e-1, eps: 1.0e-8, momentum: 0.9, centered: false}
  # Nesterov requires momentum > 0 and dampening = 0.
  # Keep learning_rate and weight_decay above; do not repeat lr/weight_decay here.
  # When editing this file, replace kwargs too when changing optimizer.
  optimizer_kwargs: {momentum: 0.9, nesterov: true}
  early_stopping:
    patience: 5            # null: all epochs; task patience AND DA/CL stability after warmup
    min_delta: 1.0e-3        # Domain-mean validation CE improvement; best.pt saves absolute minima after active DA warmup
    window: 5             # Compare adjacent post-warmup windows of active DA loss/accuracy and CL loss
    relative_delta: 1.0e-2 # Stable if mean change <= absolute_delta + relative_delta * max(abs(means))
    absolute_delta: 1.0e-3 # Fixed tolerance added to the relative term
    # With auxiliary monitors, earliest stop: warmup + 2*window + patience - 1.
  scheduler:
    name: cosine              # none / cosine / plateau; main optimizer scheduler, updated once per epoch
    # none:    {}
    # cosine:  {eta_min: 1.0e-4}  # T_max defaults to training.epochs
    # plateau: {factor: 0.5, patience: 5, min_lr: 1.0e-4}  # Monitors domain-mean validation task CE
    kwargs: {eta_min: 1.0e-4}

sampling:
  enabled: true            # Train only; false restores shuffled training.batch_size
  classes_per_batch: 5     # Capped at the number of available task classes
  domains_per_class: 5     # Available domains first; repeat slots if fewer exist
  samples_per_domain: 4    # Per class/domain slot; effective batch = capped classes * domains * samples (here 60)

monitoring:
  enabled: true
  project: wifi-conformal
  mode: online              # online / offline; online requires W&B authentication
  entity: null              # null: default W&B account/team
  name: null                # null: use experiment directory name
  gradient_interval: 100    # Sample gradient diagnostics at batch 1 and every N training batches
  parameter_histograms: true # Parameter/gradient histograms on the diagnostic schedule
  activation_gradients: true # Hook selected layer outputs for gradient statistics
  layers: null              # null: all Conv2d/Linear/AdaptiveAvgPool2d modules; otherwise module-name glob patterns
  # With encoder_background.enabled: e.g. ["task_model.embedding", "background_encoder.embedding"].
  # Without it: e.g. ["embedding", "fusion.*"]. Every pattern must match the selected model.

inference:
  batch_size: 4             # GPU microbatch for export in run/evaluate; independent of training batch size

score:
  kind: softmax            # Score = 1 - NN probability; no separate scorer fitting

# score:
#   kind: kde                  # Embedding-based score; alternative sections replace the active score block
#   kernel: gaussian
#   bandwidth: 4.0

# score:
#   kind: svm
#   kernel: linear             # linear / rbf
#   C: 1.0
#   gamma: scale               # Ignored by the linear kernel

# score:
#   kind: hbgb
#   max_iter: 100
#   learning_rate: 0.1
#   max_leaf_nodes: 7

calibration:
  # alpha: 0.1             # Omitted: schema default 0.1; nominal coverage = 1 - alpha
  weighted_cp: false        # true uses estimated density-ratio weights

# For background target weighting: enable encoder_background before training, then set
# calibration.weighted_cp: true and weighting.features: background.
weighting:
  # Always estimate weights from unlabeled test inputs; no extra domains are reserved.
  # Mixture mode needs >=2 training domains; estimated weights do not guarantee target coverage.
  features: background            # task / background; background requires a trained disentangled checkpoint
  method: domain_mixture     # density_ratio: source/target logistic classifier; domain_mixture: source-domain mixture
  C: 1.0                   # Inverse regularization strength of the independent logistic classifier
  max_iter: 1000           # Logistic fit limit; also mixture-proportion iteration limit in domain_mixture
  clip_min: null            # Optional explicit density-ratio clipping; changes the estimated ratio
  clip_max: null           # null: no bound on this side; inspect saved weight/ESS diagnostics

# Evaluation sweep; calibration.alpha is automatically included, then values sorted/deduplicated.
alpha_grid: [1.0e-2, 2.0e-2, 3.0e-2, 4.0e-2, 5.0e-2, 6.0e-2, 7.0e-2, 8.0e-2, 9.0e-2, 0.1]
