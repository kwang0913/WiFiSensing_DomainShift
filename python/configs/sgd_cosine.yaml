# Example override for setting_dataset/self_time. Start with a short trial.
split_seed: 42
training_seed: 43

training:
  epochs: 50
  optimizer: sgd
  learning_rate: 0.01
  optimizer_kwargs:
    momentum: 0.9
    nesterov: true

scheduler:
  name: cosine
  kwargs:
    eta_min: 0.000001

augmentation:
  enabled: true
  time_noise:
    enabled: true
    kind: gaussian
    relative_std: 0.02
    probability: 0.5
  time_mask:
    enabled: false
    max_fraction: 0.05
    probability: 0.5
  stft_mask:
    enabled: true
    frequency_bins: 32
    time_max_fraction: 0.05
    frequency_max_fraction: 0.05
    probability: 0.5
